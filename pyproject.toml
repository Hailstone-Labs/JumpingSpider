[project]
name = "JumpingSpider"
version = "0.2.0"
description = "Web Crawler"
readme = "README.md"
authors = [
    { name = "Roger Allen", email = "roger.allen795@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "textual>=8.2.8",
]

[project.scripts]
JumpingSpider = "JumpingSpider:main"
jumping-spider = "JumpingSpider:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = ["N999"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "JumpingSpider"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
