[project]
name = "JumpingSpider"
version = "0.2.1"
description = "Concurrent path-bounded web crawler, broken link detector, and asset validator with multi-format reports and Textual TUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roger Allen", email = "roger.allen795@gmail.com" }
]
keywords = ["crawler", "spider", "broken-links", "link-checker", "tui", "textual", "seo", "site-audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Hailstone-Labs/JumpingSpider"
Repository = "https://github.com/Hailstone-Labs/JumpingSpider"
Issues = "https://github.com/Hailstone-Labs/JumpingSpider/issues"
Changelog = "https://github.com/Hailstone-Labs/JumpingSpider/blob/main/CHANGELOG.md"

[project.scripts]
JumpingSpider = "JumpingSpider:main"
jumping-spider = "JumpingSpider:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = ["N999"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "JumpingSpider"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
