name: Bug Report
description: Report a bug or unexpected behavior in JumpingSpider
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command or TUI steps to reproduce the issue.
      placeholder: |
        1. Run `uv run JumpingSpider https://example.com/docs/ -o report.json`
        2. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (OS & Python version)
      placeholder: "e.g., macOS 15.1, Python 3.13, JumpingSpider v0.2.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      description: Paste any relevant terminal output or stack traces here.
      render: shell
    validations:
      required: false
